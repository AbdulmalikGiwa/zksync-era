version: '3.2'
services:
  l1:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.l1
    volumes:
      - type: bind
        source: ${HOME}/${COMPOSE_PROJECT_NAME}-data/l1_data
        target: /db/.syscoin
    ports:
      - 127.0.0.1:8545:8545

  zk:
    image: "ghcr.io/matter-labs/zk-environment:cuda-11_8-latest"
    container_name: zk
    depends_on:
      - l1
      - postgres
    security_opt:
      - seccomp:unconfined
    command: tail -f /dev/null
    volumes:
      - .:/usr/src/zksync
      - /usr/src/cache:/usr/src/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/src/keys:/mnt/prover_setup_keys
    env_file:
      - ./.env
    extra_hosts:
      - "host:host-gateway"
    profiles:
      - runner
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  postgres:
    image: "postgres:14"
    command: postgres -c 'max_connections=200'
    ports:
      - 127.0.0.1:5432:5432
    environment:
      # We bind only to 127.0.0.1, so setting insecure password is acceptable here
      - POSTGRES_PASSWORD=notsecurepassword
